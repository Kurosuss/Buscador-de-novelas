name: Compilar BuscadorNovelas (Windows)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python tests/test_basico.py
      - run: python -m PyInstaller --noconfirm --clean BuscadorNovelas.spec
      - run: Compress-Archive -Path dist/BuscadorNovelas -DestinationPath dist/BuscadorNovelas.zip -Force
      - name: Huella SHA-256 (se publica en el resumen de la ejecución)
        run: |
          $h = (Get-FileHash dist/BuscadorNovelas.zip -Algorithm SHA256).Hash
          "SHA-256 de BuscadorNovelas.zip: $h" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v4
        with:
          name: BuscadorNovelas-windows
          path: dist/BuscadorNovelas.zip
